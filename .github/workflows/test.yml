name: TypeScript tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Typecheck UI
        run: npx tsc --noEmit
      - name: Test UI
        run: npm test
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci
      - name: Typecheck MCP
        working-directory: mcp
        run: npm run typecheck
      # The protocol test needs a built kokon-service and MCP bundle; the others need no binaries.
      - name: Test MCP paths, tools and version
        working-directory: mcp
        run: npm test -- test/paths.test.ts test/tools.test.ts test/version.test.ts
