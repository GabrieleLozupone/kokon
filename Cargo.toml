[workspace]
resolver = "3"
members = ["crates/qls-core", "crates/qls-service", "src-tauri"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "AGPL-3.0-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Image processing is far too slow unoptimized; keep deps optimized in dev/test.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1
