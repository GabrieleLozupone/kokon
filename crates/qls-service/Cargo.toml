[package]
name = "qls-service"
version.workspace = true
license.workspace = true
edition.workspace = true

# The executable users see (Task Manager, the install folder) carries the product name.
[[bin]]
name = "kokon-service"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
qls-core = { version = "0.12.1", path = "../qls-core" }
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
